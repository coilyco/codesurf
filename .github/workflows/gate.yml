# The org ruleset's required check (COI-3297): a job named `gate`, on PRs and main pushes.
# It runs the daemon package tests only. ci.yml stays separate, it fails upstream on audit.
name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm --prefix packages/codesurf-daemon ci
      - run: npm --prefix packages/codesurf-daemon test
